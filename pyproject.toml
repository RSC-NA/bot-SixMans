[project]
name = "RSC-SixMans-Bot"
version = "1.0.0"
# Upper bound tracks red-discordbot 3.5.x, which declares Requires-Python >=3.8.1,<3.12.
requires-python = ">=3.11,<3.12"
dependencies = ["red-discordbot>=3.5.24", "pydantic>=2.0"]

[tool.uv]
# The cog is loaded by Red via [p]addpath, never installed into the venv.
package = false

[tool.pytest.ini_options]
minversion = "9.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 200
indent-width = 4
exclude = ["data/"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM", "PTH", "TID", "ASYNC"]
ignore = ["B904", "SIM103", "SIM108"]

[tool.codespell]
ignore-words-list = "alltime"

[dependency-groups]
# pip is imported by redbot.core.core_commands, which redbot's pytest plugin pulls in at collection.
dev = ["pytest>=9.0.2", "pytest-asyncio>=1.0", "pip"]
